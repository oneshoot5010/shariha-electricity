<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#000000;--cd:#111111;--bd:#262626;--am:#FFB020;--tx:#FFFFFF;--mu:#9A9A9A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:sans-serif;padding:16px 16px 90px}
h1{font-size:22px;margin:0 0 12px}.c{background:var(--cd);border-radius:18px;padding:16px;margin-bottom:12px;line-height:1.7}.m{color:var(--mu);font-size:13px}.t{text-align:center}
.b{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border:0;border-radius:14px;background:var(--am);color:#000000;font:800 16px sans-serif;margin-top:10px;text-decoration:none;padding:0}
.b.g{background:transparent;border:1px solid var(--mu);color:var(--tx)}.b.w{background:#25D366}
input{width:100%;min-height:48px;margin-top:6px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);padding:0 12px;font:700 16px sans-serif}
.r{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:4px;background:var(--cd);padding:6px}nav button{flex:1;min-height:46px;border:0;border-radius:12px;background:none;color:var(--mu);font:700 13px sans-serif}nav .on{background:var(--am);color:#000000}
#t{position:fixed;bottom:80px;left:16px;right:16px;background:var(--am);color:#000000;border-radius:12px;padding:12px;text-align:center;font-weight:700;display:none}
.g4{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}.p{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:10px 4px;color:var(--tx);font:700 13px sans-serif}.p.on{border-color:var(--am);background:#2A2000}.p i{display:block;font-style:normal;font-size:26px}
.tb{display:flex;gap:3px;margin:10px 0 6px}.tb b{flex:1;height:10px;border-radius:5px;background:var(--bd)}.tb .on{background:var(--am)}
</style></head><body><div id="v"></div><div id="t"></div><nav id="n"></nav>
<script>
const A=window.Android,$=id=>document.getElementById(id),D=864e5,now=()=>Date.now(),B=[50,100,200,350,650,1000];
const ms=t=>typeof t=='number'?t:Date.parse(t)+432e5,fmt=t=>new Date(t).toLocaleDateString('ar-EG',{day:'numeric',month:'long'}),fmt2=t=>new Date(t).toLocaleString('ar-EG',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
let S={};try{S=JSON.parse(localStorage.s||'{}')}catch(e){}
S.c=(S.c||[]).map(x=>({t:ms(x.t),a:x.a}));S.r=(S.r||[]).map(x=>({t:ms(x.t),v:x.v}));S.d=S.d||[];if(S.n===undefined)S.n=true;
let T,tab='h',sel=0;
const sv=()=>{localStorage.s=JSON.stringify(S);sch()};
window.onerror=(m,u,l)=>A.logError(m+' @'+l);
const toast=m=>{const t=$('t');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2800)};
try{T=JSON.parse(A.asset('tariffs.json'))}catch(e){A.logError('tariffs '+e)}
A.get('https://raw.githubusercontent.com/oneshoot5010/shariha-electricity/main/app/src/main/assets/tariffs.json','gotT');
function gotT(x){try{T=JSON.parse(x);if(tab=='h')go('h');sch()}catch(e){}}
function cost(k){let c=0,p=0;for(const[u,r]of T.tiers){if(k<=u)return c+(k-p)*r;c+=(u-p)*r;p=u}return k<=T.flat[0][0]?k*T.flat[0][1]:k*T.flat[1][1]}
function tierN(k){const i=T.tiers.findIndex(x=>k<=x[0]);return i<0?(k<=T.flat[0][0]?6:7):i+1}
function mk(){const r=S.r.slice(-3);if(r.length>1){const a=r[0],b=r[r.length-1],d=(b.t-a.t)/D;if(d>=1&&b.v>a.v)return(b.v-a.v)/d*30}
const s=S.d.reduce((x,y)=>x+y.w*y.h*30/1000,0);return s||null}
function ds(){const c=S.c.slice(-3),r=S.r.slice(-3),m=mk();
if(r.length>1&&r[r.length-1].v>r[0].v&&r[r.length-1].t-r[0].t>=D)return[cost(m)/30,2];
if(c.length>1){const d=(c[c.length-1].t-c[0].t)/D,s=c.slice(0,-1).reduce((x,y)=>x+y.a,0);if(d>=.5&&s>0)return[s/d,1]}
return m&&S.c.length?[cost(m)/30,0]:null}
function bal(e){let b=0,p=0,T=0;for(const x of S.c){if(p)b=Math.max(0,b-e*(x.t-p)/D);b+=x.a;T=b;p=x.t}return[Math.max(0,b-e*(now()-p)/D),T]}
function ring(p,big,sub){const C=439.8;return`<svg viewBox="0 0 180 180" width="210" style="display:block;margin:auto"><circle cx="90" cy="90" r="70" fill="none" stroke="#262626" stroke-width="14"/><circle cx="90" cy="90" r="70" fill="none" stroke="#FFB020" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 90 90)"/><text x="90" y="92" text-anchor="middle" font-size="32" font-weight="800" fill="#FFFFFF">${big}</text><text x="90" y="116" text-anchor="middle" font-size="14" fill="#9A9A9A">${sub}</text></svg>`}
function alerts(){const o=[],e=ds(),m=mk(),t=now();
if(e){const l=bal(e[0])[0]/e[0],at=d=>{const x=new Date(t+d*D);x.setHours(10,0,0,0);return x.getTime()};
[2,1].forEach(d=>{const a=at(l-d);if(l>d&&a>t)o.push({at:a,id:'e'+d,title:'الكارت قرّب يخلص ⚡',text:d==2?'فاضل يومين تقريباً، اشحن قريب':'فاضل يوم تقريباً، اشحن النهارده'})})}
if(m){const k=m/30,n=new Date(),dm=n.getDate()-1+n.getHours()/24,m0=new Date(n.getFullYear(),n.getMonth(),1).getTime(),nb=B.find(x=>x>k*dm);
if(nb){const day=nb/k,a=m0+(day-1)*D;if(day<=31&&a>t)o.push({at:a,id:'t',title:'قرّبت من الشريحة الجاية 📈',text:'فاضل حوالي يوم وتدخل شريحة أعلى، خفّف الأجهزة التقيلة'})}}
return o}
function sch(){try{const e=ds();A.widget(e?bal(e[0])[0]:0,e?e[0]:0)}catch(x){A.logError('wd '+x)}try{A.schedule(JSON.stringify(S.n&&T?alerts():[]))}catch(e){A.logError('sch '+e)}try{const e=ds();A.widget(e?bal(e[0])[0]:0,e?e[0]:0)}catch(x){}}
function art(b){const d=(b==null?128.4:b).toFixed(2).padStart(7,'0');return`<svg viewBox="0 0 320 120" width="100%" style="margin-bottom:12px;direction:ltr"><g transform="rotate(-8 70 60)"><rect x="12" y="22" width="122" height="78" rx="10" fill="#FFB020"/><rect x="24" y="40" width="22" height="17" rx="3" fill="#000" opacity=".75"/><rect x="24" y="72" width="62" height="5" rx="2" fill="#000" opacity=".6"/><rect x="24" y="83" width="38" height="5" rx="2" fill="#000" opacity=".4"/><path d="M110 32l-10 15h7l-4 13 12-17h-7z" fill="#000"/></g><rect x="160" y="8" width="150" height="104" rx="12" fill="#111" stroke="#262626"/><rect x="172" y="20" width="126" height="40" rx="6" fill="#050505" stroke="#FFB020" stroke-opacity=".5"/><text x="235" y="48" text-anchor="middle" font-family="monospace" font-size="24" font-weight="700" fill="#FFB020">${d}</text><text x="292" y="32" text-anchor="end" font-size="8" fill="#FFB020">EGP</text><circle cx="188" cy="86" r="8" fill="#FFB020"/><rect x="208" y="80" width="80" height="12" rx="6" fill="#262626"/><rect x="208" y="98" width="50" height="5" rx="2" fill="#262626"/></svg>`}
function home(){const e=ds(),m=mk();let h='<h1>⚡ Wattly</h1>'+art(e?bal(e[0])[0]:null);
if(!e)h+='<div class="c">سجّل شحنة من تبويب "الشحن" وضيف أجهزتك من تبويب "الأجهزة"، وبعد شحنتين أقولك الكارت هيخلص إمتى.</div>';
else{const[v,k]=e,[b,Tt]=bal(v),l=b/v,w=k==2?.08:k==1?.12:.2;
h+=`<div class="c">${ring(Tt?Math.min(1,b/Tt):0,b.toFixed(0)+' ج',l.toFixed(0)+' يوم')}<div class="m t">هيخلص تقريباً بين</div><div class="t" style="font-size:20px;font-weight:800">${fmt(now()+l*(1-w)*D)} و ${fmt(now()+l*(1+w)*D)}</div><div class="m t" style="margin-top:6px">${['دقة تقريبية من أجهزتك، سجّل شحنتين','الدقة كويسة','الدقة عالية بقراءات العداد'][k]}</div></div>`}
if(m){const n=tierN(m),nb=B[n-1];h+=`<div class="c"><div class="m">استهلاكك في الشهر تقريباً</div><div style="font-size:26px;font-weight:800">${m.toFixed(0)} ك.و.س</div><div class="tb">${[1,2,3,4,5,6,7].map(i=>`<b class="${i<=n?'on':''}"></b>`).join('')}</div><div>الشريحة ${n} · الفاتورة حوالي ${cost(m).toFixed(0)} ج</div>${nb?`<div class="m">باقي ${(nb-m).toFixed(0)} ك.و.س على الشريحة ${n+1}</div>`:''}</div>`}
return h+'<button class="b g" onclick="A.scan()">📷 صوّر العداد</button>'}
function chg(){return`<h1>الشحن</h1><div class="c"><label class="m">مبلغ الشحنة (ج)<input id="am" type="number" inputmode="decimal"></label><button class="b" onclick="addC()">سجّل الشحنة</button></div>
<div class="c"><label class="m">قراءة العداد<input id="rv" type="number" inputmode="numeric"></label><button class="b" onclick="addR()">سجّل القراءة</button><button class="b g" onclick="A.scan()">📷 صوّر العداد</button></div>
<div class="c"><div class="m">الشحنات</div>${S.c.slice().reverse().map(x=>`<div class="r"><span class="m">${fmt2(x.t)}</span><b>${x.a} ج</b></div>`).join('')||'<div class="m">لسه مفيش</div>'}</div>
<div class="c"><div class="m">القراءات</div>${S.r.slice().reverse().map(x=>`<div class="r"><span class="m">${fmt2(x.t)}</span><b>${x.v}</b></div>`).join('')||'<div class="m">لسه مفيش</div>'}</div>`}
function addC(){const a=+$('am').value;if(!a)return toast('اكتب المبلغ');S.c.push({t:now(),a});sv();go('c');toast('اتسجلت الشحنة')}
function addR(){const v=+$('rv').value;if(!v)return toast('اكتب القراءة');S.r.push({t:now(),v});sv();go('c');toast('اتسجلت القراءة')}
function onScan(v){go('c');if(v){$('rv').value=v;toast('قريت '+v+'، راجعها وبعدين دوس سجّل')}else toast('معرفتش أقرا الرقم، جرّب تاني أو اكتبه بإيدك')}
const P=[['❄️','تكييف',1200],['🚿','سخان',2000],['🧊','تلاجة',120],['🌀','غسالة',500],['📺','تلفزيون',100],['🌬️','مروحة',60],['💡','لمبات',100],['🍲','ميكروويف',1200],['👔','مكواة',1000],['💻','كمبيوتر',150],['📡','راوتر',15],['🔌','شاحن موبايل',20],['🚰','مضخة مياه',750],['🍳','فرن كهربا',2000],['🥤','خلاط',400],['🧹','مكنسة',1400],['➕','جهاز تاني',100]];
function dev(){const p=P[sel],tot=S.d.reduce((x,y)=>x+y.w*y.h*30/1000,0)||1;
return`<h1>الأجهزة</h1><div class="c"><div class="g4">${P.map((x,i)=>`<button class="p ${i==sel?'on':''}" onclick="pick(${i})"><i>${x[0]}</i>${x[1]}</button>`).join('')}</div>${p[0]=='➕'?'<label class="m">اسم الجهاز<input id="pn"></label>':''}<label class="m">الوات<input id="pw" type="number" inputmode="numeric" value="${p[2]}"></label><label class="m">ساعات في اليوم<input id="ph" type="number" inputmode="decimal" value="4"></label><button class="b" onclick="addD()">ضيف الجهاز</button></div>`+
S.d.map((x,i)=>{const k=x.w*x.h*30/1000,q=Math.round(k/tot*100);return`<div class="c"><div class="r" style="border:0;padding:0"><b>${x.i||'🔌'} ${x.n}</b><b>${k.toFixed(0)} ك.و.س</b></div><div class="tb"><b class="on" style="flex:none;width:${q}%"></b><b></b></div><div class="m">${x.w} واط × ${x.h} ساعة · ${q}% من الاستهلاك</div><button class="b g" onclick="delD(${i})">امسح</button></div>`}).join('')}
function pick(i){sel=i;go('d')}
function addD(){const p=P[sel],w=+$('pw').value,h=+$('ph').value;if(!w||!h)return toast('اكتب الوات والساعات');S.d.push({i:p[0],n:p[0]=='➕'?($('pn').value||'جهاز'):p[1],w,h});sv();go('d')}
function delD(i){S.d.splice(i,1);sv();go('d')}
function tg(){S.n=!S.n;sv();go('s')}
function set(){return`<h1>الإعدادات</h1><div class="c"><div class="m">الإصدار ${A.version()}</div><button class="b" onclick="upd()">حدّث التطبيق</button><div id="us" class="m" style="margin-top:8px"></div></div><div class="c"><button class="b g" style="margin-top:0" onclick="tg()">${S.n?'🔔 الإشعارات شغّالة':'🔕 الإشعارات واقفة'}</button><button class="b g" onclick="cp()">انسخ تقرير الأخطاء</button><button class="b g" onclick="go('hp')">اشرح لي التطبيق</button><button class="b g" onclick="go('dv')">عن المطور</button></div>`}
function upd(){$('us').textContent='بدوّر على تحديث...';A.get('https://api.github.com/repos/oneshoot5010/shariha-electricity/releases/latest','gotU')}
function gotU(x){const u=$('us');try{const j=JSON.parse(x),n=parseInt(j.tag_name.replace(/\D/g,''));if(n>A.versionCode()){u.textContent='لقيت تحديث، بنزّله...';A.update(j.assets[0].browser_download_url)}else u.textContent='إنت على آخر إصدار'}catch(e){u.textContent='معرفتش أتأكد من التحديث، جرّب بعد شوية'}}
function onUpd(m){const u=$('us');if(u)u.textContent=m}
function cp(){A.copy(A.errors()||'مفيش أخطاء مسجلة');toast('تقرير الأخطاء اتنسخ')}
function help(){return`<h1>التطبيق بيشتغل إزاي</h1><div class="c"><b>1. الشحن</b><br>كل ما تشحن الكارت اكتب المبلغ. بعد شحنتين التطبيق يعرف بتصرف كام في اليوم ويقولك الكارت هيخلص إمتى.<br><br><b>2. صوّر العداد</b><br>اختياري. صورة للعداد بتقرا الرقم لوحدها وتخلّي التوقع أدق، وتعرفك إنت في أنهي شريحة.<br><br><b>3. الأجهزة</b><br>ضيف أجهزتك وساعات تشغيلها، وشوف مين أكتر واحد بياكل في الفاتورة.<br><br><b>4. الإشعارات</b><br>التطبيق ينبّهك قبل ما الكارت يخلص بيومين وبيوم، وقبل ما تدخل الشريحة الجاية.<br><br><b>5. التحديث</b><br>من الإعدادات دوس "حدّث التطبيق" وهيتحدّث من غير ما تفتح جيت هب.<br><br><b>6. لو حصل خطأ</b><br>من الإعدادات دوس "انسخ تقرير الأخطاء" وابعته للمطور.<br><br><span class="m">الأرقام تقديرية ومش هتطابق الفاتورة بالملّي.</span></div>`}
function devp(){return`<h1>عن المطور</h1><div class="c t" style="padding:28px 16px"><div style="width:84px;height:84px;margin:0 auto 12px;border-radius:50%;background:linear-gradient(135deg,#FFB020,#B36B00);color:#000000;font:800 40px sans-serif;line-height:84px">M</div><b dir="ltr" style="font-size:22px">Mohamed Hassan Taha</b><div class="m">مطوّر تطبيقات أندرويد</div></div><a class="b w" href="https://wa.me/201044947639">💬 كلمني على واتساب</a><div class="m t" dir="ltr" style="margin:6px 0">+201044947639</div><a class="b g" href="https://github.com/oneshoot5010">🐙 افتح GitHub</a><div class="m t" dir="ltr" style="margin:6px 0">github.com/oneshoot5010</div><div class="m t" style="margin-top:40px">صُنع بحب في مصر 🇪🇬<br>إصدار ${A.version()}</div>`}
function back(){if(tab=='hp'||tab=='dv'){go('s');return true}if(tab!='h'){go('h');return true}return false}
const V={h:home,c:chg,d:dev,s:set,hp:help,dv:devp},N=[['h','الرئيسية'],['c','الشحن'],['d','الأجهزة'],['s','الإعدادات']];
function go(x){tab=x;try{$('v').innerHTML=V[x]()}catch(e){A.logError('render '+x+' '+e)}
$('n').innerHTML=N.map(n=>`<button class="${n[0]==x||(n[0]=='s'&&(x=='hp'||x=='dv'))?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}
go('h');sch()
</script></body></html>
